<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bateria Porcaria - Gestão</title>
    <style>
    * { 
        box-sizing: border-box; 
        font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif; 
    }
    body { 
        background-color: #0d0d0d; 
        color: #f5f5f5; 
        margin: 0; 
        padding: 20px; 
    }
    .container { 
        max-width: 1000px; 
        margin: auto; 
    }
    header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 2px solid #ff007f; 
        padding-bottom: 15px; 
        margin-bottom: 25px; 
    }
    h1 { 
        color: #ff007f; 
        margin: 0; 
        font-size: 1.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    h2, h3 { 
        color: #ffffff; 
        margin: 0 0 10px 0; 
    }
    .card { 
        background: #181818; 
        padding: 20px; 
        border-radius: 10px; 
        margin-bottom: 20px; 
        border: 1px solid #2a2a2a;
        box-shadow: 0 4px 12px rgba(255, 0, 127, 0.05); 
    }
    input, select, button { 
        padding: 12px; 
        margin: 6px 0; 
        border-radius: 6px; 
        border: 1px solid #333; 
        background: #242424; 
        color: #fff; 
        width: 100%; 
        font-size: 0.95rem;
    }
    input:focus, select:focus {
        outline: none;
        border-color: #ff007f;
    }
    button { 
        background: #ff007f; 
        color: #ffffff; 
        font-weight: bold; 
        cursor: pointer; 
        border: none; 
        transition: background 0.2s, transform 0.1s;
    }
    button:hover { 
        background: #d6006b; 
    }
    button:active {
        transform: scale(0.98);
    }
    .btn-danger { 
        background: #2a2a2a; 
        color: #ff007f; 
        border: 1px solid #ff007f;
    }
    .btn-danger:hover { 
        background: #ff007f; 
        color: #ffffff;
    }
    table { 
        width: 100%; 
        border-collapse: collapse; 
        margin-top: 15px; 
    }
    th, td { 
        border: 1px solid #2a2a2a; 
        padding: 12px; 
        text-align: left; 
    }
    th { 
        background: #242424; 
        color: #ff007f; 
        font-weight: 600;
    }
    tr:nth-child(even) {
        background-color: #141414;
    }
    .grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 20px; 
    }
    @media (max-width: 768px) {
        .grid { grid-template-columns: 1fr; }
    }
    .hidden { display: none; }
    .status-logged { 
        color: #ff007f; 
        font-weight: bold; 
    }
    hr {
        border: 0;
        height: 1px;
        background: #2a2a2a;
    }
</style>
</head>
<body>
    <div class="container">
    <header>
        <h1>🥁 Bateria Porcaria - UNESP Rio Claro</h1>
        <button id="btn-logout" class="btn-danger hidden" onclick="fazerLogout()" style="width: auto; padding: 8px 15px;">Sair</button>
    </header>

    <!-- TELA DE LOGIN (Exibida por padrão) -->
    <div id="login-card" class="card">
        <h2>Acesso Restrito - Patrimônio</h2>
        <p style="color: #aaa; font-size: 0.9rem;">Faça login com a conta da diretoria para acessar o sistema.</p>
        <input type="text" id="login-username" placeholder="Usuário">
        <input type="password" id="login-password" placeholder="Senha">
        <button onclick="realizarLogin()">Entrar</button>
    </div>

    <!-- PAINEL PRINCIPAL (Oculto até o login) -->
    <div id="painel-conteudo" class="grid hidden">
        <!-- SEÇÃO DE INVENTÁRIO -->
        <div class="card">
            <h2>Inventário de Instrumentos</h2>
            <div id="form-inventario" style="margin-top: 15px;">
                <h3>Adicionar Instrumento</h3>
                <input type="text" id="inv-nome" placeholder="Nome (ex: Surdo 22')">
                <input type="text" id="inv-categoria" placeholder="Categoria (ex: Grave)">
                <input type="number" id="inv-qtd" placeholder="Quantidade">
                <input type="text" id="inv-estado" placeholder="Estado (ex: Bom, Manutenção)">
                <button onclick="cadastrarInventario()">Salvar Instrumento</button>
                <hr>
            </div>
            
            <table id="tabela-inventario">
                <thead>
                    <tr><th>Nome</th><th>Cat.</th><th>Qtd</th><th>Estado</th><th>Ação</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- SEÇÃO DE LISTA DE COMPRAS -->
        <div class="card">
            <h2>Lista de Compras Pendentes</h2>
            <div id="form-compras" style="margin-top: 15px;">
                <h3>Adicionar à Lista</h3>
                <input type="text" id="compra-item" placeholder="Item (ex: Pele de Caixa 14')">
                <input type="number" id="compra-qtd" placeholder="Quantidade">
                <button onclick="cadastrarCompra()">Adicionar à Lista</button>
                <hr>
            </div>

            <table id="tabela-compras">
                <thead>
                    <tr><th>Item</th><th>Qtd</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

    <script>
    const API_URL = "http://127.0.0.1:8000"; // No Render, use a URL relativa "" ou a URL do Render
    let token = localStorage.getItem("token") || "";

    function atualizarInterface() {
        const loggedIn = !!token;
        
        document.getElementById("login-card").classList.toggle("hidden", loggedIn);
        document.getElementById("painel-conteudo").classList.toggle("hidden", !loggedIn);
        document.getElementById("btn-logout").classList.toggle("hidden", !loggedIn);

        if (loggedIn) {
            carregarInventario();
            carregarCompras();
        }
    }

    async function realizarLogin() {
        const user = document.getElementById("login-username").value;
        const pass = document.getElementById("login-password").value;

        const formData = new URLSearchParams();
        formData.append("username", user);
        formData.append("password", pass);

        const res = await fetch(`/login`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData
        });

        if (res.ok) {
            const data = await res.json();
            token = data.access_token;
            localStorage.setItem("token", token);
            atualizarInterface();
        } else {
            alert("Usuário ou senha incorretos!");
        }
    }

    function fazerLogout() {
        token = "";
        localStorage.removeItem("token");
        atualizarInterface();
    }

    async function carregarInventario() {
        const res = await fetch(`/inventario`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        
        if (res.status === 401) { fazerLogout(); return; }
        
        const dados = await res.json();
        const tbody = document.querySelector("#tabela-inventario tbody");
        tbody.innerHTML = "";

        dados.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.nome}</td>
                    <td>${item.categoria}</td>
                    <td>${item.quantidade}</td>
                    <td>${item.estado}</td>
                    <td>
                        <button class="btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deletarInventario(${item.id})">X</button>
                    </td>
                </tr>
            `;
        });
    }

    async function cadastrarInventario() {
        const body = {
            nome: document.getElementById("inv-nome").value,
            categoria: document.getElementById("inv-categoria").value,
            quantidade: parseInt(document.getElementById("inv-qtd").value),
            estado: document.getElementById("inv-estado").value
        };

        const res = await fetch(`/inventario`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            carregarInventario();
            document.getElementById("inv-nome").value = "";
            document.getElementById("inv-categoria").value = "";
            document.getElementById("inv-qtd").value = "";
            document.getElementById("inv-estado").value = "";
        }
    }

    async function deletarInventario(id) {
        if (!confirm("Deseja mesmo remover este item?")) return;
        
        await fetch(`/inventario/${id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });
        carregarInventario();
    }

    async function carregarCompras() {
        const res = await fetch(`/compras`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (res.status === 401) return;

        const dados = await res.json();
        const tbody = document.querySelector("#tabela-compras tbody");
        tbody.innerHTML = "";

        dados.forEach(c => {
            tbody.innerHTML += `
                <tr>
                    <td>${c.item}</td>
                    <td>${c.quantidade}</td>
                    <td>${c.status}</td>
                </tr>
            `;
        });
    }

    async function cadastrarCompra() {
        const body = {
            item: document.getElementById("compra-item").value,
            quantidade: parseInt(document.getElementById("compra-qtd").value)
        };

        const res = await fetch(`/compras`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            carregarCompras();
            document.getElementById("compra-item").value = "";
            document.getElementById("compra-qtd").value = "";
        }
    }

    atualizarInterface();
</script>
    </script>
</body>
</html>
